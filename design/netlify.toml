# DriveMe — Netlify configuration
#
# This file lives in `design/`, so set the site's **Base directory** to `design`
# (Site configuration → Build & deploy → Build settings). Netlify then reads this
# file, installs from design/package.json, and publishes design/ itself.
#
# The content pages are generated from content/ by build/build.mjs (see
# `npm run build`); the app surfaces (admin, track, driver) and the archived
# concept homepage under legacy/ stay hand-written. The functions in
# netlify/functions/ are thin wrappers around the shared handlers in api/
# (see api/_lib/netlify-adapter.js).

[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # @supabase/supabase-js ships CommonJS; inlining it into an ESM function
  # crashes at runtime. Ship it from node_modules instead of bundling it.
  external_node_modules = ["@supabase/supabase-js"]
  # the wrappers import from ../../api, which sits outside the functions folder
  included_files = ["api/**"]

# ---------------------------------------------------------------------------
# API. Rewrites (status 200), not redirects — the browser keeps calling /api/*.
# Declared before the catch-all guards below, because first match wins.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/driver-location"
  to = "/.netlify/functions/driver-location"
  status = 200

[[redirects]]
  from = "/api/driver-trip"
  to = "/.netlify/functions/driver-trip"
  status = 200

[[redirects]]
  from = "/api/driver-status"
  to = "/.netlify/functions/driver-status"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

# ---------------------------------------------------------------------------
# Don't serve the source that happens to sit in the publish directory.
# `publish = "."` means everything here is a candidate static file, including
# the SQL migrations, the shared API helpers and any local .env file.
#
# force = true is required on every one of these: without it Netlify serves the
# real file and ignores the rule, because redirects only apply to paths that
# would otherwise 404.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# Generator sources. They sit in the publish directory but are not the site.
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.generated-files.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dev-server.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# vercel.json is meaningless here and only advertises the other host's config
[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true

# Belt and braces for local env files. Netlify does not appear to serve dotfiles
# today, but that is undocumented behaviour and .env.local sits in the publish
# directory — this makes it explicit rather than incidental.
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.local"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Archived concept pages. Kept reachable for internal comparison, never
# indexed: their content is what section 12 of the growth strategy asked to
# remove from the customer site (founder note, market counters, roadmap,
# the metro surcharge and the subscription).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/dark"
  to = "/01-driveme-landing"
  status = 302

[[redirects]]
  from = "/light"
  to = "/02-driveme-light"
  status = 302

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# Media never changes once published, so cache it hard.
[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ui.css / ui.js are hand-edited and their filenames carry no content hash, so
# they must NOT be immutable — that told browsers never to re-check them, and a
# shipped fix could not reach anyone who had already loaded the page. Pages
# reference them with ?v=N as well; bump that when either file changes.
[[headers]]
  for = "/assets/ui.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/ui.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Generated CSS/JS for the content pages: hand-edited names with no content
# hash, so they must revalidate rather than being cached immutably.
[[headers]]
  for = "/assets/site.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/site.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/booking.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Archived and operational surfaces must never enter the index.
[[headers]]
  for = "/legacy/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/01-driveme-landing"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/02-driveme-light"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# The request form collects personal data and has no search value.
[[headers]]
  for = "/pyyda-tarjous/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/en/request-a-quote/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

[[headers]]
  for = "/sv/begar-offert/*"
  [headers.values]
    X-Robots-Tag = "noindex, follow"

