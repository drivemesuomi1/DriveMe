# Kept deliberately in step with the `headers` block in vercel.json — if you
# change the policy for one host, change it for the other or they will drift.
# connect-src covers Supabase, Photon (geocoding) and OSRM (routing); img-src
# covers the CARTO, satellite and terrain basemap tiles; script-src covers Leaflet and supabase-js.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.cartocdn.com https://server.arcgisonline.com https://*.tile.opentopomap.org; media-src 'self'; connect-src 'self' https://*.supabase.co https://photon.komoot.io https://router.project-osrm.org https://tiles.openfreemap.org; worker-src blob:; upgrade-insecure-requests"
