# DriveMe — Netlify configuration
#
# This file lives in `design/`, so set the site's **Base directory** to `design`
# (Site configuration → Build & deploy → Build settings). Netlify then reads this
# file, installs from design/package.json, and publishes design/ itself.
#
# There is no build step — the site is hand-written HTML. The only compiled
# things are the functions in netlify/functions/, which are thin wrappers around
# the shared handlers in api/ (see api/_lib/netlify-adapter.js).

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  # @supabase/supabase-js ships CommonJS; inlining it into an ESM function
  # crashes at runtime. Ship it from node_modules instead of bundling it.
  external_node_modules = ["@supabase/supabase-js"]
  # the wrappers import from ../../api, which sits outside the functions folder
  included_files = ["api/**"]

# ---------------------------------------------------------------------------
# API. Rewrites (status 200), not redirects — the browser keeps calling /api/*.
# Declared before the catch-all guards below, because first match wins.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/notify"
  to = "/.netlify/functions/notify"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/driver-location"
  to = "/.netlify/functions/driver-location"
  status = 200

[[redirects]]
  from = "/api/config"
  to = "/.netlify/functions/config"
  status = 200

# ---------------------------------------------------------------------------
# Don't serve the source that happens to sit in the publish directory.
# `publish = "."` means everything here is a candidate static file, including
# the SQL migrations, the shared API helpers and any local .env file.
#
# force = true is required on every one of these: without it Netlify serves the
# real file and ignores the rule, because redirects only apply to paths that
# would otherwise 404.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/dev-server.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# vercel.json is meaningless here and only advertises the other host's config
[[redirects]]
  from = "/vercel.json"
  to = "/404.html"
  status = 404
  force = true

# Belt and braces for local env files. Netlify does not appear to serve dotfiles
# today, but that is undocumented behaviour and .env.local sits in the publish
# directory — this makes it explicit rather than incidental.
[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.local"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Theme shortcuts — mirrors what vercel.json did.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/dark"
  to = "/01-driveme-landing"
  status = 302

[[redirects]]
  from = "/light"
  to = "/02-driveme-light"
  status = 302

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# Operational surfaces: never cache, never index.
[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/track"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/driver"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

# Kept deliberately in step with the `headers` block in vercel.json — if you
# change the policy for one host, change it for the other or they will drift.
# connect-src covers Supabase, Photon (geocoding) and OSRM (routing); img-src
# covers the CARTO basemap tiles; script-src covers Leaflet and supabase-js.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.basemaps.cartocdn.com https://*.cartocdn.com; media-src 'self'; connect-src 'self' https://*.supabase.co https://photon.komoot.io https://router.project-osrm.org; upgrade-insecure-requests"
